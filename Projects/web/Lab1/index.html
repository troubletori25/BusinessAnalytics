<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex"> 
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
    crossorigin="anonymous">
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=qdQpy48X3Rjv&format=png&color=000000">
    <title>Lab1</title>
    <style>
    body {
        text-align: center;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px;
    }

    .container {
        max-width: 1000px;
        margin: 0 auto;
    }

    .images {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        margin-bottom: 30px;
    }

    .images img {
        object-fit: contain;
        border-radius: 8px;
    }

    .back-button {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 9px 15px;
        background: #222;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.2s;
    }

    .back-button:hover {
        background: #555;
    }
    </style>
    <!-- integrity="" -->
</head>
<body>
    <a href="../web.html" class="back-button"> ← Back to Web </a>

    <div class ="container">
        <h1>JS OOP</h1>
        <div class="images">
            <img src="MandW.jpg" width="300" height="300"><br>
            <img src="ClassDiagram.png" width="500" height="300"><br>
        </div>
        <script>
            class Person
            {
                WashDishes() {
                    return 'wipe dry';
                }
                get type(){
                    return "Man";
                }
            }

            class Man extends Person {
                WashDishes() {
                    return 'wet';
                }
                get type(){
                    return "Man";
                }
            }

            class Woman extends Person {
                WashDishes() {
                    return 'dry';
                }
                get type(){
                    return "Woman";
                }
            }

            var person = new Person();
            document.write(person.WashDishes());

            var man = new Man();
            document.write("<br>"+man.WashDishes());

            var woman = new Woman();
            document.write("<br>"+woman.WashDishes());
            
            var family = [woman, man];
            var Number_Of_Plates =10;

            for(j=1; j<=Number_Of_Plates; j++){
                document.write("<br> - PLate no."+j);
                for(i=0; i<2; i++)
                {
                    document.write("<br>"+family[i].WashDishes());
                }  
            }
            
        </script>
    </div>
</body>
</html>
